name: Build DLNA Renderer Filter

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read plugin version
        shell: bash
        run: |
          VERSION=$(grep -oPm1 '(?<=<AssemblyInformationalVersion>)[^<]+' Emby.DlnaRendererFilter.csproj)
          echo "PLUGIN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"

      - name: Restore
        run: dotnet restore Emby.DlnaRendererFilter.csproj

      - name: Build
        run: dotnet build Emby.DlnaRendererFilter.csproj -c Release --no-restore

      - name: Package
        run: |
          mkdir -p artifact
          cp bin/Release/netstandard2.0/Emby.DlnaRendererFilter.dll artifact/
          cp README.md artifact/
          cp LICENSE artifact/
          cp CHANGELOG.md artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: Emby-DLNA-Renderer-Filter-v${{ env.PLUGIN_VERSION }}
          path: artifact/

      - name: Create GitHub Release if missing
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${PLUGIN_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          gh release create "$TAG"             bin/Release/netstandard2.0/Emby.DlnaRendererFilter.dll             --target "$GITHUB_SHA"             --title "Emby DLNA Renderer Filter $TAG"             --generate-notes
