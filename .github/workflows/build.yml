name: Build DLNA Renderer Filter

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      plugin_version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oPm1 '(?<=<AssemblyInformationalVersion>)[^<]+' Emby.DlnaRendererFilter.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PLUGIN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"

      - name: Restore
        run: dotnet restore Emby.DlnaRendererFilter.csproj

      - name: Build
        run: dotnet build Emby.DlnaRendererFilter.csproj -c Release --no-restore

      - name: Package
        run: |
          mkdir -p artifact
          cp bin/Release/netstandard2.0/Emby.DlnaRendererFilter.dll artifact/
          cp README.md artifact/
          cp LICENSE artifact/
          cp CHANGELOG.md artifact/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Emby-DLNA-Renderer-Filter-v${{ steps.version.outputs.version }}
          path: artifact/

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Emby-DLNA-Renderer-Filter-v${{ needs.build.outputs.plugin_version }}
          path: artifact

      - name: Create GitHub Release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PLUGIN_VERSION: ${{ needs.build.outputs.plugin_version }}
        run: |
          TAG="v$PLUGIN_VERSION"

          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          gh release create "$TAG"             artifact/Emby.DlnaRendererFilter.dll             --repo "$REPOSITORY"             --target "$GITHUB_SHA"             --title "Emby DLNA Renderer Filter $TAG"             --generate-notes
